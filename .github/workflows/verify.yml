name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and crash-safe drift proofs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_HARNESS_ROOT: /tmp/dsh-plan-lattice-frozen-harness

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch frozen DeepSeek Harness
        run: |
          git init "$DEEPSEEK_HARNESS_ROOT"
          git -C "$DEEPSEEK_HARNESS_ROOT" remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C "$DEEPSEEK_HARNESS_ROOT" fetch --depth=1 origin 47f943859bef60e4160492346772ded9b24f765a
          git -C "$DEEPSEEK_HARNESS_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$DEEPSEEK_HARNESS_ROOT" rev-parse HEAD)" = 47f943859bef60e4160492346772ded9b24f765a

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run check

      - name: Run plugin, evaluation, and mechanism tests
        run: pnpm test

      - name: Generate this run's mechanism evidence
        run: |
          pnpm run demo:first-drift
          pnpm run demo:crash-continuity

      - name: Build package tarball
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          shasum -a 256 dsh-plan-lattice-*.tgz > dsh-plan-lattice.sha256

      - name: Upload mechanism evidence
        uses: actions/upload-artifact@v7
        with:
          name: plan-lattice-mechanism-${{ runner.os }}-${{ runner.arch }}
          path: |
            demo/results/first-drift-benchmark.json
            demo/results/first-drift-benchmark.md
            demo/results/crash-continuity-benchmark.json
            demo/results/crash-continuity-benchmark.md
            ${{ runner.temp }}/dsh-plan-lattice-*.tgz
            ${{ runner.temp }}/dsh-plan-lattice.sha256
          if-no-files-found: error

  harness-compatibility:
    name: Official Harness ${{ matrix.harness }} compatibility (${{ matrix.artifact }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: rc.7
            harness_key: rc7
            harness_version: 0.1.0-rc.7
            harness_tag: dsh-v0.1.0-rc.7
            harness_commit: 99f6f02fecdb7dff40c3fbc9470f5907c29f74ca
            artifact: current main candidate
            key: current-main
            source: candidate
          - harness: rc.7
            harness_key: rc7
            harness_version: 0.1.0-rc.7
            harness_tag: dsh-v0.1.0-rc.7
            harness_commit: 99f6f02fecdb7dff40c3fbc9470f5907c29f74ca
            artifact: published v0.4.0-rc.6
            key: published-rc6
            source: release
          - harness: 0.1.1-rc.2
            harness_key: 0_1_1_rc2
            harness_version: 0.1.1-rc.2
            harness_tag: dsh-v0.1.1-rc.2
            harness_commit: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
            artifact: current main candidate
            key: current-main
            source: candidate
          - harness: 0.1.1-rc.2
            harness_key: 0_1_1_rc2
            harness_version: 0.1.1-rc.2
            harness_tag: dsh-v0.1.1-rc.2
            harness_commit: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
            artifact: published v0.4.0-rc.6
            key: published-rc6
            source: release
    env:
      HARNESS_COMMIT: ${{ matrix.harness_commit }}
      HARNESS_TAG: ${{ matrix.harness_tag }}
      HARNESS_VERSION: ${{ matrix.harness_version }}
      RELEASE_RC6_SHA256: 9e522d43877debcccbcad1e1ebb15916fbb35d50a9a98032bdc6149802c30082

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          cache: pnpm

      - name: Verify official Harness tag
        run: |
          resolved="$(git ls-remote https://github.com/deepseek-ai/deepseek-harness.git "refs/tags/$HARNESS_TAG" | cut -f1)"
          test "$resolved" = "$HARNESS_COMMIT"

      - name: Build candidate package
        if: matrix.source == 'candidate'
        run: |
          pnpm install --frozen-lockfile
          pnpm pack --pack-destination "$RUNNER_TEMP"
          package="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'dsh-plan-lattice-*.tgz' -print -quit)"
          test -n "$package"
          echo "PACKAGE_PATH=$package" >> "$GITHUB_ENV"
          echo "PLAN_LATTICE_SOURCE=commit:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Download published RC.6 package
        if: matrix.source == 'release'
        run: |
          package="$RUNNER_TEMP/dsh-plan-lattice-0.4.0-rc.6.tgz"
          curl --fail --location --silent --show-error \
            https://github.com/1052326311/dsh-plan-lattice/releases/download/v0.4.0-rc.6/dsh-plan-lattice-0.4.0-rc.6.tgz \
            --output "$package"
          echo "$RELEASE_RC6_SHA256  $package" | sha256sum --check --strict
          echo "PACKAGE_PATH=$package" >> "$GITHUB_ENV"
          echo "PLAN_LATTICE_SOURCE=release:v0.4.0-rc.6" >> "$GITHUB_ENV"

      - name: Install and start with official Harness ${{ matrix.harness }}
        run: |
          runtime="$RUNNER_TEMP/harness-${{ matrix.harness_key }}-${{ matrix.key }}"
          home="$RUNNER_TEMP/dsh-home-${{ matrix.harness_key }}-${{ matrix.key }}"
          mkdir -p "$runtime"
          cd "$runtime"
          npm init -y
          cp "$GITHUB_WORKSPACE/eval/fixtures/compatibility-runtime/pnpm-workspace.yaml" .
          pnpm add --save-exact "@deepseek-ai/dsh@$HARNESS_VERSION"
          dsh="$runtime/node_modules/.bin/dsh"
          test "$("$dsh" --version)" = "$HARNESS_VERSION"
          DSH_HOME="$home" "$dsh" plugin --profile web add "$PACKAGE_PATH"
          DSH_HOME="$home" "$dsh" plugin --profile web add "$GITHUB_WORKSPACE/eval/fixtures/plugins/tool-schema-probe"
          node -e "const p=require('$home/profiles/web/package.json'); if (!p.dependencies?.['dsh-plan-lattice'] || !p.dsh?.profile?.bundles?.includes('dsh-plan-lattice')) process.exit(1)"
          PLAN_LATTICE_SCHEMA_PROBE="$RUNNER_TEMP/plan-lattice-schemas.json" \
            DSH_HOME="$home" "$dsh" --profile web --host 127.0.0.1 --port 18080 >"$RUNNER_TEMP/harness-${{ matrix.harness_key }}-${{ matrix.key }}.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/ >"$RUNNER_TEMP/harness-${{ matrix.harness_key }}-${{ matrix.key }}.html"; then
              break
            fi
            sleep 1
          done
          test -s "$RUNNER_TEMP/harness-${{ matrix.harness_key }}-${{ matrix.key }}.html"
          grep -q '<title>DeepSeek Harness</title>' "$RUNNER_TEMP/harness-${{ matrix.harness_key }}-${{ matrix.key }}.html"
          for attempt in $(seq 1 30); do
            test -s "$RUNNER_TEMP/plan-lattice-schemas.json" && break
            sleep 1
          done
          COMPATIBILITY_RECORD="$RUNNER_TEMP/compatibility-${{ matrix.key }}.json"
          export COMPATIBILITY_RECORD
          export ARTIFACT_SHA256="$(sha256sum "$PACKAGE_PATH" | cut -d ' ' -f 1)"
          export PLAN_LATTICE_VERSION="$(tar -xOf "$PACKAGE_PATH" package/package.json | node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => console.log(JSON.parse(data).version))")"
          node - <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs')
          const actual = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/plan-lattice-schemas.json', 'utf8'))
          const expected = [
            'lattice_add',
            'lattice_adopt_context',
            'lattice_archive',
            'lattice_checkout',
            'lattice_checkpoint',
            'lattice_commit_input_review',
            'lattice_commit_intake',
            'lattice_intake',
            'lattice_open',
            'lattice_reframe',
            'lattice_refresh_context',
            'lattice_review_input',
            'lattice_route',
            'lattice_split',
            'lattice_status',
            'lattice_update',
          ]
          if (JSON.stringify(actual) !== JSON.stringify(expected)) {
            throw new Error(`unexpected Plan Lattice tool schemas: ${JSON.stringify(actual)}`)
          }
          const record = {
            schema: 'dsh-plugin-compatibility/v1',
            verified: true,
            source: process.env.PLAN_LATTICE_SOURCE,
            planLatticeVersion: process.env.PLAN_LATTICE_VERSION,
            artifactSha256: process.env.ARTIFACT_SHA256,
            dshVersion: process.env.HARNESS_VERSION,
            dshTag: process.env.HARNESS_TAG,
            dshCommit: process.env.HARNESS_COMMIT,
            checkedAt: new Date().toISOString(),
            runner: `${process.platform}-${process.arch}-node-${process.version}`,
            checks: [
              'artifact-sha256',
              'fresh-profile-install',
              'profile-manifest-render',
              'web-http-200',
              'web-title',
              'tool-schema-registration',
            ],
            registeredToolSchemas: actual,
          }
          writeFileSync(process.env.COMPATIBILITY_RECORD, `${JSON.stringify(record, null, 2)}\n`, 'utf8')
          console.log(JSON.stringify(record, null, 2))
          NODE
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT

      - name: Upload compatibility record
        uses: actions/upload-artifact@v7
        with:
          name: dsh-${{ matrix.harness_key }}-compatibility-${{ matrix.key }}
          path: ${{ runner.temp }}/compatibility-${{ matrix.key }}.json
          if-no-files-found: error

  alpha1-plugin-inventory-contract:
    name: Official Harness alpha.1 plugin identity source contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALPHA_COMMIT: cd5ef8148158c3a752a658978873241fdf8e2bbc
      ALPHA_TAG: dsh-v0.1.2-alpha.1
      ALPHA_VERSION: 0.1.2-alpha.1
      RELEASE_RC6_SHA256: 9e522d43877debcccbcad1e1ebb15916fbb35d50a9a98032bdc6149802c30082

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          cache: pnpm

      - name: Build candidate and acquire published RC.6
        run: |
          pnpm install --frozen-lockfile
          pnpm pack --pack-destination "$RUNNER_TEMP"
          candidate="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'dsh-plan-lattice-*.tgz' -print -quit)"
          test -n "$candidate"
          release="$RUNNER_TEMP/published-dsh-plan-lattice-0.4.0-rc.6.tgz"
          curl --fail --location --silent --show-error \
            https://github.com/1052326311/dsh-plan-lattice/releases/download/v0.4.0-rc.6/dsh-plan-lattice-0.4.0-rc.6.tgz \
            --output "$release"
          echo "$RELEASE_RC6_SHA256  $release" | sha256sum --check --strict
          echo "CANDIDATE_PACKAGE=$candidate" >> "$GITHUB_ENV"
          echo "RELEASE_PACKAGE=$release" >> "$GITHUB_ENV"
          echo "CANDIDATE_SHA256=$(sha256sum "$candidate" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Fetch exact official Harness alpha.1 source
        run: |
          alpha_root="$RUNNER_TEMP/deepseek-harness-alpha1"
          git init "$alpha_root"
          git -C "$alpha_root" remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C "$alpha_root" fetch --depth=1 origin "$ALPHA_COMMIT"
          git -C "$alpha_root" checkout --detach FETCH_HEAD
          test "$(git -C "$alpha_root" rev-parse HEAD)" = "$ALPHA_COMMIT"
          resolved="$(git ls-remote https://github.com/deepseek-ai/deepseek-harness.git "refs/tags/$ALPHA_TAG" | cut -f1)"
          test "$resolved" = "$ALPHA_COMMIT"
          echo "ALPHA_ROOT=$alpha_root" >> "$GITHUB_ENV"

      - name: Install official alpha.1 source dependencies
        run: pnpm --dir "$ALPHA_ROOT" install --frozen-lockfile

      - name: Exercise the official active-package identity resolver
        run: |
          candidate_root="$RUNNER_TEMP/inventory-current"
          release_root="$RUNNER_TEMP/inventory-published-rc6"
          mkdir -p "$candidate_root/node_modules/dsh-plan-lattice" "$release_root/node_modules/dsh-plan-lattice"
          tar -xzf "$CANDIDATE_PACKAGE" --strip-components=1 -C "$candidate_root/node_modules/dsh-plan-lattice"
          tar -xzf "$RELEASE_PACKAGE" --strip-components=1 -C "$release_root/node_modules/dsh-plan-lattice"
          cp "$GITHUB_WORKSPACE/eval/fixtures/plugin-inventory/plan-lattice-alpha1.spec.ts" \
            "$ALPHA_ROOT/packages/llm/plugin-package-inventory-deepseek/tests/plan-lattice-alpha1.spec.ts"
          export PLAN_LATTICE_CANDIDATE_ROOT="$candidate_root"
          export PLAN_LATTICE_CANDIDATE_SOURCE="commit:$GITHUB_SHA"
          export PLAN_LATTICE_CANDIDATE_SHA256="$CANDIDATE_SHA256"
          export PLAN_LATTICE_RELEASE_ROOT="$release_root"
          export PLAN_LATTICE_RELEASE_SOURCE="release:v0.4.0-rc.6"
          export PLAN_LATTICE_RELEASE_SHA256="$RELEASE_RC6_SHA256"
          export INVENTORY_RECORD="$RUNNER_TEMP/plugin-inventory-alpha1.json"
          pnpm --dir "$ALPHA_ROOT" exec vitest run \
            packages/llm/plugin-package-inventory-deepseek/tests/plan-lattice-alpha1.spec.ts

      - name: Upload alpha.1 source-contract record
        uses: actions/upload-artifact@v7
        with:
          name: dsh-alpha1-plugin-inventory-source-contract
          path: ${{ runner.temp }}/plugin-inventory-alpha1.json
          if-no-files-found: error
