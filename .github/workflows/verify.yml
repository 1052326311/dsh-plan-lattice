name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and first-drift proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_HARNESS_ROOT: /tmp/dsh-plan-lattice-frozen-harness

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch frozen DeepSeek Harness
        run: |
          git init "$DEEPSEEK_HARNESS_ROOT"
          git -C "$DEEPSEEK_HARNESS_ROOT" remote add origin https://github.com/deepseek-ai/deepseek-harness.git
          git -C "$DEEPSEEK_HARNESS_ROOT" fetch --depth=1 origin 47f943859bef60e4160492346772ded9b24f765a
          git -C "$DEEPSEEK_HARNESS_ROOT" checkout --detach FETCH_HEAD
          test "$(git -C "$DEEPSEEK_HARNESS_ROOT" rev-parse HEAD)" = 47f943859bef60e4160492346772ded9b24f765a

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run check

      - name: Run plugin, evaluation, and first-drift tests
        run: pnpm test

      - name: Generate this run's first-drift evidence
        run: pnpm run demo:first-drift

      - name: Build package tarball
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

      - name: Upload first-drift evidence
        uses: actions/upload-artifact@v7
        with:
          name: first-drift-${{ runner.os }}-${{ runner.arch }}
          path: |
            demo/results/first-drift-benchmark.json
            demo/results/first-drift-benchmark.md
          if-no-files-found: error
